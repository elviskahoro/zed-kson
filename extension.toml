id = "kson"
name = "KSON"
version = "0.1.0"
schema_version = 1
authors = ["Elvis Kahoro <elvis@elvis.ai>"]
description = "KSON language support: language server integration and editing configuration."
repository = "https://github.com/elviskahoro/zed-kson"

languages = ["languages/kson"]
snippets = ["./snippets/kson.json"]

[grammars.kson]
# The grammar sources live in this repository under `path`; Zed clones
# `repository` at `rev` and builds `path`'s `src/parser.c`. See
# docs/grammar-registration.md for how this pin was chosen and how to
# override it with a file:// URL for local development.
repository = "https://github.com/elviskahoro/zed-kson"
rev = "953c3159037e82fc21986c88eeb3d05e3ef13e43"
path = "tree-sitter-kson"

[language_servers.kson-language-server]
name = "KSON Language Server"
languages = ["KSON"]

# The adapter runs `<node> --version` to gate on Node.js 24+ before
# launching the server (src/node.rs). Zed only allows process::Command
# calls the manifest lists; the node path differs per machine (Zed's
# bundled Node or `node` on PATH), so the command is a wildcard and the
# arguments are pinned to exactly `--version`.
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--version"]

# The server bundle is downloaded from this repository's GitHub releases
# (src/distribution.rs, PINNED_DISTRIBUTION).
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["elviskahoro", "zed-kson", "releases", "download", "**"]
